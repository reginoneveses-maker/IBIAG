name: ibiag-local
services:
  mongo:
    image: mongo:7.0
    restart: "no"
    environment:
      MONGO_INITDB_ROOT_USERNAME: local_root
      MONGO_INITDB_ROOT_PASSWORD: ${LOCAL_MONGO_ROOT_PASSWORD:?Run Iniciar IBIAG first}
      MONGO_INITDB_DATABASE: ibiag_local
      IBIAG_DB_PASSWORD: ${LOCAL_DB_PASSWORD:?Run Iniciar IBIAG first}
    volumes:
      - mongo_data:/data/db
      - ./local/mongo-init.js:/docker-entrypoint-initdb.d/10-ibiag.js:ro
    networks: [database]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "const c = new Mongo('mongodb://127.0.0.1:27017'); const a = c.getDB('admin'); a.auth('local_root', process.env.MONGO_INITDB_ROOT_PASSWORD); if (a.runCommand({ping:1}).ok !== 1) quit(1);"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    environment:
      MONGO_URL: mongodb://ibiag_app:${LOCAL_DB_PASSWORD:?Run Iniciar IBIAG first}@mongo:27017/ibiag_local?authSource=ibiag_local
      DB_NAME: ibiag_local
      JWT_SECRET: ${LOCAL_JWT_SECRET:?Run Iniciar IBIAG first}
      APP_NAME: ibiag
      STORAGE_PROVIDER: gridfs
      CORS_ORIGINS: http://127.0.0.1:8787,http://localhost:8787
      ALLOW_PUBLIC_REGISTRATION: "false"
      ENABLE_API_DOCS: "false"
      ALLOW_PAID_DISCOVERY: "false"
      TRUSTED_PROXY_IPS: ""
      IBIAG_LOCAL_ONLY: "1"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [database, application]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: local/Dockerfile.web
    restart: "no"
    ports:
      - "127.0.0.1:8787:8080"
    depends_on:
      api:
        condition: service_healthy
    networks: [application]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 10s
      retries: 30
volumes:
  mongo_data:
networks:
  database:
    internal: true
  application:
