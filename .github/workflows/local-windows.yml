name: IBIAG Local Installation
on:
  pull_request:
    branches: ["operations/**", "local/**"]
jobs:
  local-containers:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build, authenticate and preserve data across container recreation
        run: python tools/check_local_install.py
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell 5.1 launcher
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "local/Start-IBIAG.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw "PowerShell parser rejected launcher." }
          Write-Host "Windows PowerShell syntax passed."
