name: IBIAG Build and Syntax Check

on:
  push:
    branches: ["feature/buyer-intelligence-foundation", "main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MONGO_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Python syntax
        run: python -m py_compile backend/server.py backend/comexstat_client.py backend/comexstat_market.py backend/backup.py
      - name: Backend tests
        run: pytest -q backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
      - name: Frontend interaction tests
        env:
          CI: "true"
          DISABLE_EMERGENT_OVERLAY: "true"
        run: npm test -- --watchAll=false --runInBand
      - name: Build frontend
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser test backend
        run: pip install -r ../backend/requirements.txt
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser workflow test
        run: npm run test:e2e
