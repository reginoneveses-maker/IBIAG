name: IBIAG Build and Syntax Check

on:
  push:
    branches: ["feature/buyer-intelligence-foundation", "main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Python syntax
        run: python -m py_compile backend/server.py backend/comexstat_client.py backend/comexstat_market.py backend/backup.py
      - name: Backend tests
        run: pytest -q backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
