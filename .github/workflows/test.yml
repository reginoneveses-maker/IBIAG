name: IBIAG Build and Syntax Check

on:
  push:
    branches: ["feature/buyer-intelligence-foundation", "main"]
  pull_request:
    branches: ["main", "security/stage1-integration-review-20261018", "local/**", "operations/**", "design/**", "improvements/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MONGO_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Python syntax
        run: python -m py_compile backend/server.py backend/comexstat_client.py backend/comexstat_market.py backend/backup.py
      - name: Backend tests
        run: pytest -q backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
      - name: Frontend interaction tests
        env:
          CI: "true"
          DISABLE_EMERGENT_OVERLAY: "true"
        run: npm test -- --watchAll=false --runInBand
      - name: Build frontend
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser test backend
        run: pip install -r ../backend/requirements.txt
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser workflow test
        run: npm run test:e2e
      - name: Visual review screenshots (synthetic fixtures only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibiag-visual-review
          path: frontend/e2e/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 1

  exporthub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exporthub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated ExportHub dependencies
        run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - name: Type check and local build (no deployment)
        run: |
          npx tsc --noEmit --incremental false
          npm run build
      - name: Security, health and source regression tests
        run: |
          node scripts/build-native-integration.cjs
          git diff --exit-code -- ../frontend/src/integration/quote-components.js ../backend/generated/quote-engine.cjs
          node scripts/test-draft-recovery.cjs
          node scripts/test-quote-completion.cjs
          node scripts/test-crm-interchange.cjs
          node scripts/test-crm-interchange-d1.cjs
          node scripts/test-spec-revisions.cjs
          node scripts/test-spec-revisions-d1.cjs
          node scripts/test-health-integrity.cjs
          node scripts/test-health-d1.cjs
          node scripts/test-members.cjs
          node scripts/test-backup-restore.cjs
          node scripts/test-crm-logic.cjs
          node scripts/test-crm-navigation.cjs
          node scripts/test-pdf-upload.cjs
          node scripts/test-product-quote.cjs
          node scripts/test-product-variants.cjs
          node scripts/test-unified-pricing.cjs
          node scripts/test-workbook-pricing.cjs
          node scripts/test-workspace-sessions.cjs

      - name: Install isolated UI verification tools
        run: npm install --no-save --package-lock=false --no-audit --no-fund playwright@^1.51.1 esbuild@0.25.11
      - name: Install local Chromium for document UI verification
        run: npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install synthetic native integration API
        run: pip install -r ../backend/requirements.txt
      - name: Document versions interaction workflow
        run: |
          node scripts/test-spec-versions-ui.cjs
          node scripts/test-crm-interchange-ui.cjs
          node scripts/test-quote-completion-ui.cjs
          node scripts/test-native-integration-ui.cjs
      - name: Document UI screenshots (synthetic data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-versions-review
          path: |
            exporthub/ui-review/*.png
            exporthub/ui-review/*.pdf
          if-no-files-found: ignore
          retention-days: 1

  candidate-config:
    runs-on: ubuntu-latest
    env:
      CANDIDATE_MONGO_ROOT_PASSWORD: "1111111111111111111111111111111111111111111111111111111111111111"
      CANDIDATE_DB_PASSWORD: "2222222222222222222222222222222222222222222222222222222222222222"
      CANDIDATE_JWT_SECRET: "3333333333333333333333333333333333333333333333333333333333333333"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Source-only release preflight tests
        run: node tools/test-release-preflight.cjs
      - name: Validate isolated candidate manifest without starting services
        run: docker compose -f compose.candidate.yaml config --quiet
      - name: Build candidate API without starting services
        run: |
          docker build -f backend/Dockerfile -t ibiag-candidate-api:ci .
          docker run --rm --network none --read-only --entrypoint node ibiag-candidate-api:ci --version
      - name: Report publication blockers without reading real environment
        run: node tools/release-preflight.cjs
